<!DOCTYPE html>
<html lang="pt-BR">

  <title>Carregando experiência | ImersaLab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="loading-page">

      <div class="loading-brand-name">IMERSA<span>LAB</span></div>

      <div class="loading-bar-shell" aria-label="Progresso de carregamento">
        <div class="loading-bar" id="loadingBar"></div>
      </div>
      <div class="loading-percent" id="loadingPercent">0%</div>
    </div>
  </main>

  <script src="js/projetos.js"></script>

<script src="js/vercel-analytics.js"></script>
