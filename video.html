<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeo | ImersaLab</title>
  <style>
    *{box-sizing:border-box}
    html,body{
      width:100%;
      height:100%;
      margin:0;
      background:#000;
      overflow:hidden;
    }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    video{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
    }
    .erro{
      display:none;
      position:absolute;
      inset:0;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      background:#000;
    }
    .erro strong{
      display:block;
      font-size:1.4rem;
      margin-bottom:8px;
    }
    .erro span{color:#aaa}
  </style>
</head>
<body>
  <video id="player" controls autoplay playsinline></video>

  <div class="erro" id="erro">
    <div>
      <strong>Vídeo ainda não adicionado.</strong>
      <span>Adicione o arquivo MP4 correspondente em assets/videos/.</span>
    </div>
  </div>

  <script src="js/projetos.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id") || "luxrefra-ar";
    const projeto = (window.PROJETOS || []).find(p => p.id === id);

    if(projeto){
      document.title = `${projeto.title} | Vídeo`;
    }

    const player = document.getElementById("player");
    const erro = document.getElementById("erro");

    player.src = `assets/videos/${encodeURIComponent(id)}.mp4`;

    player.addEventListener("error", () => {
      player.style.display = "none";
      erro.style.display = "flex";
    });
  </script>
<script src="js/vercel-analytics.js"></script>
</body>
</html>
